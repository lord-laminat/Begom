name: ${COMPOSE_PROJECT_NAME:-begom}

x-logging: &logging
  driver: fluentd
  options:
    fluentd-address: 127.0.0.1:24224
    fluentd-async: 'true'
    fluentd-buffer-limit: '4096'
    mode: non-blocking
    max-buffer-size: 4m
    tag: 'begom.{{.Name}}'
    cache-max-size: 10m
    cache-max-file: '3'

x-app: &app
  image: begom-app:1.0.0
  build: {context: ., target: app}
  restart: unless-stopped
  init: true
  networks: [control]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  logging: *logging

x-worker: &worker
  <<: *app
  entrypoint: [/usr/local/bin/node-helper]
  command: [serve, --config, /config/agent.json]
  depends_on: {coordinator: {condition: service_healthy}}
  mem_limit: 256m
  cpus: 2
  pids_limit: 128
  healthcheck:
    test: [CMD, /usr/local/bin/begomctl, health, --url, 'https://127.0.0.1:9101/healthz', --ca, /run/secrets/ca.crt, --cert, /run/secrets/agent.crt, --key, /run/secrets/agent.key]
    interval: 5s
    timeout: 4s
    retries: 6

services:
  permissions:
    <<: *app
    user: '0:0'
    entrypoint: [/usr/local/bin/begomctl]
    command: [permissions, --dir, /bootstrap]
    restart: 'no'
    read_only: false
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}:/bootstrap
      - bao-data:/bao-data
      - grafana-data:/grafana-data
      - prometheus-data:/prometheus-data
      - loki-data:/loki-data
      - backup-repository:/backup-data

  postgres:
    image: begom-postgres:18.6
    build: {context: ., target: database}
    restart: unless-stopped
    networks: [control]
    depends_on: {permissions: {condition: service_completed_successfully}}
    environment:
      POSTGRES_USER: begom_admin
      POSTGRES_DB: begom
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/postgres.crt, -c, ssl_key_file=/run/secrets/postgres.key, -c, ssl_min_protocol_version=TLSv1.3, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse, -c, log_parameter_max_length=0, -c, log_parameter_max_length_on_error=0, -c, max_connections=100]
    volumes:
      - postgres-data:/var/lib/postgresql
      - ${BEGOM_STATE_DIR:-./.local}/secrets/postgres-password:/run/secrets/postgres-password:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/app-db-password:/run/secrets/app-db-password:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/backup-db-password:/run/secrets/backup-db-password:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/metrics-db-password:/run/secrets/metrics-db-password:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/postgres.crt:/run/secrets/postgres.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/postgres.key:/run/secrets/postgres.key:ro
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U begom_admin -d begom'], interval: 2s, timeout: 3s, retries: 30}
    mem_limit: 512m
    logging: *logging

  openbao:
    image: quay.io/openbao/openbao:2.7.1@sha256:6d2b93856e3fcf7b18ad855a0b51eaba474dc8b79cf554379ea32034797d2acf
    user: '10000:10000'
    restart: unless-stopped
    networks: [control, edge]
    depends_on: {permissions: {condition: service_completed_successfully}}
    command: [server, -config=/bao/config/config.hcl]
    ports: ['127.0.0.1:8200:8200']
    volumes:
      - bao-data:/bao/file
      - ./deploy/openbao/config.hcl:/bao/config/config.hcl:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/openbao.crt:/run/secrets/openbao.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/openbao.key:/run/secrets/openbao.key:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging

  bootstrap:
    <<: *app
    user: '0:0'
    entrypoint: [/usr/local/bin/begomctl]
    command: [bao-init, --dir, /bootstrap, --url, 'https://openbao:8200']
    restart: 'no'
    depends_on: {openbao: {condition: service_started}}
    read_only: false
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    volumes: ['${BEGOM_STATE_DIR:-./.local}:/bootstrap']

  coordinator:
    <<: *app
    user: '10000:10000'
    depends_on: {bootstrap: {condition: service_completed_successfully}, postgres: {condition: service_healthy}}
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/config/coordinator.json:/config/coordinator.json:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/coordinator-role-id:/run/secrets/role-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/coordinator-secret-id:/run/secrets/secret-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage:/data
      - ${BEGOM_STATE_DIR:-./.local}/packages:/packages:ro
    healthcheck: {test: [CMD, /usr/local/bin/begomctl, health], interval: 2s, timeout: 4s, retries: 30, start_period: 30s}
    mem_limit: 512m
    cpus: 3

  worker-1:
    <<: *worker
    user: '10001:10000'
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/config/worker-1.json:/config/agent.json:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-1.crt:/run/secrets/agent.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-1.key:/run/secrets/agent.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-1-role-id:/run/secrets/role-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-1-secret-id:/run/secrets/secret-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-1-ssh-host.key:/run/secrets/ssh-host.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-1-ssh-client.pub:/run/secrets/ssh-client.pub:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/package.pub:/run/secrets/package.pub:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/.begom-volume:/data/.begom-volume:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/staging/worker-1:/data/staging/worker-1
      - ${BEGOM_STATE_DIR:-./.local}/updates/worker-1:/updates

  worker-2:
    <<: *worker
    user: '10002:10000'
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/config/worker-2.json:/config/agent.json:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-2.crt:/run/secrets/agent.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-2.key:/run/secrets/agent.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-2-role-id:/run/secrets/role-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-2-secret-id:/run/secrets/secret-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-2-ssh-host.key:/run/secrets/ssh-host.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-2-ssh-client.pub:/run/secrets/ssh-client.pub:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/package.pub:/run/secrets/package.pub:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/.begom-volume:/data/.begom-volume:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/staging/worker-2:/data/staging/worker-2
      - ${BEGOM_STATE_DIR:-./.local}/updates/worker-2:/updates

  worker-3:
    <<: *worker
    user: '10003:10000'
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/config/worker-3.json:/config/agent.json:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-3.crt:/run/secrets/agent.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-3.key:/run/secrets/agent.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-3-role-id:/run/secrets/role-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-3-secret-id:/run/secrets/secret-id:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-3-ssh-host.key:/run/secrets/ssh-host.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/worker-3-ssh-client.pub:/run/secrets/ssh-client.pub:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/package.pub:/run/secrets/package.pub:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/.begom-volume:/data/.begom-volume:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/staging/worker-3:/data/staging/worker-3
      - ${BEGOM_STATE_DIR:-./.local}/updates/worker-3:/updates

  mockdonor:
    <<: *app
    entrypoint: [/usr/local/bin/mockdonor]
    networks: [control, edge]
    ports: ['127.0.0.1:8090:8090']
    depends_on: {permissions: {condition: service_completed_successfully}}
    volumes: ['${BEGOM_STATE_DIR:-./.local}/secrets/mock-token:/run/secrets/mock-token:ro']
    mem_limit: 128m

  nginx:
    image: begom-nginx:1.30.6
    build: {context: ., dockerfile: deploy/nginx/Dockerfile}
    restart: unless-stopped
    networks: [control, edge]
    depends_on: {coordinator: {condition: service_healthy}, grafana: {condition: service_started}}
    ports: ['127.0.0.1:8443:8443']
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/secrets/web.crt:/run/secrets/web.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/web.key:/run/secrets/web.key:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage/published:/published:ro
    mem_limit: 128m
    logging: *logging

  prometheus:
    logging: *logging
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    restart: unless-stopped
    networks: [control]
    depends_on: {permissions: {condition: service_completed_successfully}}
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=7d, --storage.tsdb.retention.size=1GB]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/metrics.crt:/run/secrets/client.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/metrics.key:/run/secrets/client.key:ro
      - prometheus-data:/prometheus
    mem_limit: 384m

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    user: '999:999'
    networks: [control]
    depends_on: {postgres: {condition: service_healthy}}
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    environment:
      DATA_SOURCE_URI: 'postgres:5432/begom?sslmode=verify-full&sslrootcert=/run/secrets/ca.crt'
      DATA_SOURCE_USER: begom_metrics
      DATA_SOURCE_PASS_FILE: /run/secrets/password
      PG_EXPORTER_COLLECTION_TIMEOUT: 600ms
    command: [--log.format=json, --config.file=/etc/postgres-exporter.yml]
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/metrics-db-password:/run/secrets/password:ro
      - ./deploy/postgres/exporter.yml:/etc/postgres-exporter.yml:ro
    mem_limit: 64m
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3@sha256:85666e7fde7e253f1c6d978f9a961245df4c9cdb7677e1866d9bb28e8f9ee41d
    restart: unless-stopped
    networks: [control]
    depends_on: {nginx: {condition: service_started}}
    command: [--nginx.scrape-uri=http://nginx:8081/nginx_status, --log.format=json]
    cap_drop: [ALL]
    read_only: true
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    logging: *logging

  loki:
    logging: *logging
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    restart: unless-stopped
    networks: [control]
    depends_on: {permissions: {condition: service_completed_successfully}}
    command: [-config.file=/etc/loki/config.yml]
    volumes: [./deploy/loki/config.yml:/etc/loki/config.yml:ro, loki-data:/loki]
    mem_limit: 384m

  grafana:
    logging: *logging
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    restart: unless-stopped
    networks: [control]
    depends_on: {permissions: {condition: service_completed_successfully}}
    environment:
      GF_SERVER_ROOT_URL: https://localhost:8443/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_AUTH_PROXY_ENABLED: 'true'
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_AUTO_SIGN_UP: 'true'
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_AUTH_BASIC_ENABLED: 'false'
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/admin-password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/begom.json
      GF_METRICS_ENABLED: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_LOG_MODE: console
      GF_LOG_CONSOLE_FORMAT: json
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/secrets/grafana-password:/run/secrets/admin-password:ro
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 1g

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:5.1.5@sha256:2740f387f6e68fab66d28e4fa6a853387b9cab6ffb4cb78958f69bba4eb0e7b4
    user: '0:0'
    restart: unless-stopped
    networks: [control, edge]
    ports: ['127.0.0.1:24224:24224']
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
    volumes:
      - ./deploy/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./deploy/fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ./deploy/fluent-bit/enrich.lua:/fluent-bit/etc/enrich.lua:ro
      - fluent-buffer:/buffers
    mem_limit: 128m

  backup:
    logging: *logging
    image: begom-backup:1.0.0
    build: {context: ., target: backup}
    profiles: [backup]
    networks: [control]
    depends_on: {coordinator: {condition: service_healthy}}
    command: [backup, run, --config, /config/backup.json]
    volumes:
      - ${BEGOM_STATE_DIR:-./.local}/config/backup.json:/config/backup.json:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/backup-db-url:/run/secrets/database-url:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/ca.crt:/run/secrets/ca.crt:ro
      - ${BEGOM_STATE_DIR:-./.local}/secrets/restic-password:/run/secrets/restic-password:ro
      - ${BEGOM_STATE_DIR:-./.local}/storage:/data:ro
      - backup-repository:/repository

  storage-faults:
    image: begom-storage-faults:1.0.0
    build: {context: ., target: storage-faults}
    profiles: [verification]
    network_mode: none
    user: '10000:10000'
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: ['/faults:size=4m,mode=1777', '/tmp:size=16m,mode=1777']
    environment: {BEGOM_FAULT_DIR: /faults}
    mem_limit: 128m

networks:
  control: {internal: true, ipam: {config: [{subnet: 172.30.69.0/24}]}}
  edge: {}
volumes:
  postgres-data: {}
  bao-data: {}
  prometheus-data: {}
  loki-data: {}
  grafana-data: {}
  fluent-buffer: {}
  backup-repository: {}
