[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File /fluent-bit/etc/parsers.conf
    HTTP_Server On
    HTTP_Listen 0.0.0.0
    HTTP_Port 2020
    storage.path /buffers/chunks
    storage.sync normal
    storage.checksum On
    storage.backlog.mem_limit 16M
    storage.metrics On
[INPUT]
    Name forward
    Listen 0.0.0.0
    Port 24224
    Mem_Buf_Limit 16M
    storage.type filesystem
[FILTER]
    Name parser
    Match begom.*
    Key_Name log
    Parser begom_json
    Reserve_Data On
    Preserve_Key Off
[FILTER]
    Name lua
    Match begom.*
    script /fluent-bit/etc/enrich.lua
    call enrich
[OUTPUT]
    Name loki
    Match begom.*
    Host loki
    Port 3100
    Labels environment=local,service=$component,level=$severity
    Line_Format json
    Retry_Limit False
    storage.total_limit_size 512M
