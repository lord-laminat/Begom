Port 2222
PidFile /run/begom-sshd.pid
HostKey /etc/begom/ssh-host.key
AllowUsers begom-admin
PermitRootLogin no
UsePAM yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile /home/begom-admin/.ssh/authorized_keys
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTTY no
PermitTunnel no
MaxSessions 1
MaxAuthTries 3
LoginGraceTime 15
ClientAliveInterval 30
ClientAliveCountMax 2
ForceCommand /usr/local/libexec/begom-node-helper ssh
