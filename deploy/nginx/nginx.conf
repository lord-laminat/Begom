user nginx begom;
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format begom escape=json '{"timestamp":"$time_iso8601","severity":"INFO","component":"nginx","operation":"http","result":"$status","method":"$request_method","path":"$uri","bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout begom;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;
  client_max_body_size 2m;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  resolver 127.0.0.11 valid=2s ipv6=off;
  upstream coordinator { zone coordinator 64k; server coordinator:8080 resolve; keepalive 32; }
  upstream grafana { zone grafana 64k; server grafana:3000 resolve; }
  server {
    listen 8081;
    location = /nginx_status { stub_status; access_log off; }
    location / { return 404; }
  }
  server {
    listen 8443 ssl;
    ssl_certificate /run/secrets/web.crt;
    ssl_certificate_key /run/secrets/web.key;
    ssl_protocols TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location /_published/ {
      internal;
      alias /published/;
      autoindex off;
      disable_symlinks on;
      limit_except GET HEAD { deny all; }
    }
    location = /_grafana_auth {
      internal;
      proxy_pass http://coordinator/internal/grafana-auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Host $http_host;
    }
    location /grafana/ {
      auth_request /_grafana_auth;
      auth_request_set $auth_user $upstream_http_x_webauth_user;
      proxy_set_header X-WEBAUTH-USER $auth_user;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_http_version 1.1;
      proxy_pass http://grafana;
    }
    location / {
      proxy_pass http://coordinator;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_http_version 1.1;
      proxy_read_timeout 65s;
      proxy_buffering off;
    }
  }
}
