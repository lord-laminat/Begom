global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: coordinator
    scheme: https
    static_configs: [{targets: ['coordinator:8444']}]
    tls_config: {ca_file: /run/secrets/ca.crt, cert_file: /run/secrets/client.crt, key_file: /run/secrets/client.key}
  - job_name: agents
    scheme: https
    static_configs:
      - targets: ['worker-1:9101']
        labels: {worker: worker-1}
      - targets: ['worker-2:9101']
        labels: {worker: worker-2}
      - targets: ['worker-3:9101']
        labels: {worker: worker-3}
    tls_config: {ca_file: /run/secrets/ca.crt, cert_file: /run/secrets/client.crt, key_file: /run/secrets/client.key}
  - job_name: openbao
    scheme: https
    metrics_path: /v1/sys/metrics
    params: {format: [prometheus]}
    static_configs: [{targets: ['openbao:8200']}]
    tls_config: {ca_file: /run/secrets/ca.crt}
  - job_name: prometheus
    static_configs: [{targets: ['prometheus:9090']}]
  - job_name: loki
    static_configs: [{targets: ['loki:3100']}]
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs: [{targets: ['grafana:3000']}]
  - job_name: fluent-bit
    metrics_path: /api/v1/metrics/prometheus
    static_configs: [{targets: ['fluent-bit:2020']}]
  - job_name: postgres
    static_configs: [{targets: ['postgres-exporter:9187']}]
  - job_name: nginx
    static_configs: [{targets: ['nginx-exporter:9113']}]
