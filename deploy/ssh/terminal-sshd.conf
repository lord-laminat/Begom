Port 2223
PidFile /run/begom-terminal/terminal.pid
HostKey /run/secrets/terminal-host.key
AllowUsers begom-shell
PermitRootLogin no
UsePAM no
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthorizedKeysFile /run/secrets/terminal-client.pub
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTTY yes
PermitTunnel no
PermitUserEnvironment no
MaxSessions 4
MaxAuthTries 3
LoginGraceTime 15
ClientAliveInterval 30
ClientAliveCountMax 2
PrintMotd no
PrintLastLog no
SetEnv LANG=C.UTF-8 LC_ALL=C.UTF-8
